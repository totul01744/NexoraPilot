<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — NexoraPilot</title>
<link rel="stylesheet" href="assets/css/style.css">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="admin-body">

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:30px">
      <div style="width:60px;height:60px;background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 14px;box-shadow:0 0 36px rgba(0,245,212,.4)">⚡</div>
      <div style="font-family:var(--font-h);font-weight:900;font-size:1.3rem;color:#fff">Admin Panel</div>
      <div style="font-size:.8rem;color:var(--text2);margin-top:3px">NexoraPilot Control Center</div>
    </div>
    <div class="form-group">
      <label class="form-label">Admin Email</label>
      <input type="email" class="form-control" id="adminEmail" placeholder="admin@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Admin Password</label>
      <input type="password" class="form-control" id="adminPass" placeholder="Password দিন">
    </div>
    <button class="btn btn-primary btn-full" id="loginBtn" onclick="adminLogin()">🔐 Login করুন</button>
    <p style="text-align:center;margin-top:14px;font-size:.78rem"><a href="index.html" style="color:var(--text2)">← NexoraPilot-এ ফিরুন</a></p>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp" class="admin-layout hidden">
  <aside class="sidebar">
    <div class="sidebar-logo">🚀 NexoraPilot Admin</div>
    <div style="padding:10px">
      <button class="sidebar-link active" onclick="showPage('dashboard')">📊 Dashboard</button>
      <button class="sidebar-link" onclick="showPage('products')">🏆 Winning Products</button>
      <button class="sidebar-link" onclick="showPage('users')">👥 All Users</button>
      <button class="sidebar-link" onclick="showPage('payments')">💳 Payments</button>
      <button class="sidebar-link" onclick="showPage('settings')">⚙️ Settings</button>
      <button class="sidebar-link" style="color:#f87171;margin-top:20px" onclick="auth.signOut()">🚪 Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page">
      <div class="admin-header"><h2>📊 Overview</h2></div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><h3>0</h3><p>Products</p></div>
        <div class="stat-card"><h3>0</h3><p>Users</p></div>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div id="page-products" class="page hidden">
      <div class="admin-header">
        <h2>🏆 Winning Products</h2>
        <button class="btn btn-primary" onclick="openProductForm()">+ Add Product</button>
      </div>
      <div class="table-card" id="productsTable"></div>
    </div>

    <!-- USERS -->
    <div id="page-users" class="page hidden">
      <div class="admin-header"><h2>👥 All Registered Users</h2></div>
      <div class="table-card" id="usersTable"></div>
    </div>
  </main>
</div>

<script src="assets/js/app.js"></script>
<script>
async function adminLogin() {
  const email = document.getElementById('adminEmail').value;
  const pass = document.getElementById('adminPass').value;
  const res = await FB.login(email, pass);
  if(res.success) {
    // Wait for auth state to catch up
  } else {
    Toast.error(res.error);
  }
}

function onAuthStateReady(user) {
  if(user && FB.isAdmin()) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminApp').classList.remove('hidden');
    initAdmin();
  } else if(user) {
    Toast.error('আপনার এডমিন এক্সেস নেই!');
    auth.signOut();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminApp').classList.add('hidden');
  }
}

async function initAdmin() {
  loadProductsTable();
  loadUsersTable();
  loadStats();
}

async function loadProductsTable() {
  const products = await FB.getProducts();
  const table = document.getElementById('productsTable');
  table.innerHTML = `<table>
    <thead><tr><th>Name</th><th>Category</th><th>Score</th><th>Type</th><th>Actions</th></tr></thead>
    <tbody>${products.map(p => `<tr>
      <td>${p.name}</td>
      <td>${p.category}</td>
      <td>${p.score}</td>
      <td>${p.premium ? 'Premium' : 'Free'}</td>
      <td><button onclick="FB.deleteProduct('${p.id}');loadProductsTable()">🗑️</button></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function loadUsersTable() {
  const snap = await db.collection('users').get();
  const users = snap.docs.map(d => d.data());
  const table = document.getElementById('usersTable');
  table.innerHTML = `<table>
    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>WhatsApp</th><th>Plan</th></tr></thead>
    <tbody>${users.map(u => `<tr>
      <td>${u.name}</td>
      <td>${u.email}</td>
      <td>${u.phone}</td>
      <td>${u.whatsapp || '-'}</td>
      <td>${u.plan}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function loadStats() {
  // Stats logic
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById('page-' + id).classList.remove('hidden');
}
</script>
</body>
</html>
